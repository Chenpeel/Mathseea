[workspace]
members = ["crates/model", "crates/graph-io", "crates/graph-engine", "crates/graph-view", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
mathseea-model = { path = "crates/model" }
mathseea-graph-io = { path = "crates/graph-io" }
mathseea-graph-engine = { path = "crates/graph-engine" }
mathseea-graph-view = { path = "crates/graph-view" }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
